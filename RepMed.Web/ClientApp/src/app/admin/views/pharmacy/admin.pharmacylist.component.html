<h3 class="mb-3">Pharmacy Details </h3>
<table id="example" class="display" style="width:100%">
  <thead>
    <tr>
      <th>Store Name</th>
      <th>License Number</th>
      <th>Owner Name</th>
      <th>Business Name</th>
      <th>License Expiry</th>
      <th>GST Number</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let pharmacy of pharmacyList">
      <td>{{ pharmacy.storeName }}</td>
      <td>{{ pharmacy.licenseNumber }}</td>
      <td>{{ pharmacy.ownerName }}</td>
      <td>{{ pharmacy.businessName }}</td>
      <td>{{ pharmacy.licenseExpiry | date }}</td>
      <td>{{ pharmacy.gstNumber }}</td>
      <td>
        <button (click)="viewPharmacy(pharmacy.id)">👁️</button>
        <button (click)="editPharmacy(pharmacy)">✏️</button>
        <button (click)="toggleStatus(pharmacy)">
          {{ pharmacy.isActive ? '🔴 Inactive' : '🟢 Active' }}
        </button>
        <button (click)="deletePharmacy(pharmacy)">🗑️</button>
      </td>
    </tr>
  </tbody>
</table>
