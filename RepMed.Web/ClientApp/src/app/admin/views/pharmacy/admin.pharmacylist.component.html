<div class="listing-container">
  <h2><i class="fas fa-clinic-medical"></i> Pharmacy List</h2>

  <div class="search-wrapper">
    <input
      type="text"
      placeholder="🔍 Search by name or city..."
      [(ngModel)]="searchTerm"
      class="search-box"
    />
  </div>

  <table class="listing-table">
    <thead>
      <tr>
        <th>#</th>
        <th><i class="fas fa-prescription-bottle-alt"></i> Pharmacy Name</th>
        <th><i class="fas fa-city"></i> City</th>
        <th><i class="fas fa-phone-alt"></i> Contact</th>
        <th><i class="fas fa-toggle-on"></i> Status</th>
        <th><i class="fas fa-eye"></i> Details</th>
        <th><i class="fas fa-edit"></i> Edit</th>
        <th><i class="fas fa-trash-alt"></i> Delete</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let pharmacy of filteredPharmacies; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ pharmacy.name }}</td>
        <td>{{ pharmacy.city }}</td>
        <td>{{ pharmacy.contact }}</td>

        <td>
          <span
            class="status-badge"
            [ngClass]="{ 'active': pharmacy.active, 'inactive': !pharmacy.active }"
          >
            {{ pharmacy.active ? 'Active' : 'Inactive' }}
          </span>
          <br />
          <button
            class="btn btn-toggle"
            [ngClass]="{ 'btn-deactivate': pharmacy.active, 'btn-activate': !pharmacy.active }"
            (click)="toggleStatus(pharmacy)"
          >
            {{ pharmacy.active ? 'Deactivate' : 'Activate' }}
          </button>
        </td>

        <td>
          <button class="btn btn-details" (click)="viewDetails(pharmacy)">
            <i class="fas fa-eye"></i> View
          </button>
        </td>

        <td>
          <button class="btn btn-edit" (click)="editPharmacy(pharmacy)">
            <i class="fas fa-edit"></i> Edit
          </button>
        </td>

        <td>
          <button class="btn btn-delete" (click)="deletePharmacy(pharmacy)">
            <i class="fas fa-trash-alt"></i> Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="no-data" *ngIf="filteredPharmacies.length === 0">
    <i class="fas fa-exclamation-circle"></i> No records found.
  </div>
</div>
