<!-- Register -->
<div class="card bg-prime">
  <div class="card-body">
    <!-- Logo -->
    <div class="app-brand justify-content-center">
      <a class="app-brand-link gap-2">
        <span class="app-brand-logo demo">
          <img src="/assets/img/repmedlogo.png" width="130" />
        </span>
      </a>
    </div>
    <form id="formAuthentication" appAutoValidate class="mb-3" [formGroup]="loginForm" (ngSubmit)="onSubmit()">


      <div class="mb-3">
        <label for="email" class="form-label">Email or Username</label>
        <input type="text" formControlName="email" maxlength="70" class="form-control" id="email" name="email-username"
          placeholder="Enter your email or username" autofocus name="email_field_fake" autocomplete="off"
          [attr.autocomplete]="'disabled'" [attr.id]="'email_' + uniqueId" />
      </div>
      <div class="mb-3 form-password-toggle">
        <div class="d-flex justify-content-between">
          <label class="form-label" for="password">Password</label>
          <!-- <a href="javascript:void(0)">
              <small>Forgot Password?</small>
            </a> -->
        </div>
        <div class="input-group input-group-merge">
          <input type="password" id="password" class="form-control" name="password" formControlName="password"
            placeholder="Enter Password" aria-describedby="password"
            name="password_field_fake" autocomplete="new-password" [attr.id]="'password_' + uniqueId" />
          <span class="input-group-text cursor-pointer"><i class="bx bx-hide"></i></span>
        </div>
      </div>
      <div class="mb-3 d-flex content-end">
        <a [routerLink]="['/forgotpassword']" class="menu-link">
          <div data-i18n="Basic">Forgot Password</div>
        </a>
      </div>
      <div class="mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember-me" formControlName="remember" />
          <label class="form-check-label" for="remember-me"> Remember Me </label>
        </div>
      </div>
      <div class="mb-3">
        <button class="btn btn-primary d-grid w-100" type="submit">Sign in</button>
      </div>
    </form>
  </div>
</div>
<!-- /Register -->
