

<div class="authentication">
    <div class="container">
        <div class="row">
            <div class="col-lg-4 col-sm-12">
                <form formvalidator class="card auth_form form_validation" *ngIf="loginForm" [formGroup]="loginForm" #myform="ngForm" (ngSubmit)="onSubmit()">
                    <div class="header">
                        <img class="logo" src="/assets/images/logobig.png" alt="">
                        <h5>Log in</h5>
                    </div>
                    <div class="body">
                        <div class="input-group mb-3 float">
                            <input validator type="text" placeholder=" " formControlName="email" class="form-control">
                            <label class="float-lbl">Username *</label>
                            <div class="input-group-append">
                                <span class="input-group-text"><i class="zmdi zmdi-account-circle"></i></span>
                            </div>
                           
                        </div>
                        <div class="input-group mb-3 flate-inp float">
                            <input validator type="password" formControlName="password"  class="form-control" placeholder=" ">
                            <label class="float-lbl">Password *</label>
                            <div class="input-group-append">                                
                                <span class="input-group-text"><i class="zmdi zmdi-lock"></i></span>
                            </div>                            
                        </div>
                        <div class="checkbox">
                            <input id="remember_me" formControlName="remamber" type="checkbox">
                            <label for="remember_me">Remember Me</label>
                        </div>
                        <!-- <a href="index.html" class="btn btn-primary btn-block waves-effect waves-light">SIGN IN</a>                         -->
                        <!-- <div class="signin_with mt-3">
                            <p class="mb-0">or Sign Up using</p>
                            <button class="btn btn-primary btn-icon btn-icon-mini btn-round facebook"><i class="zmdi zmdi-facebook"></i></button>
                            <button class="btn btn-primary btn-icon btn-icon-mini btn-round twitter"><i class="zmdi zmdi-twitter"></i></button>
                            <button class="btn btn-primary btn-icon btn-icon-mini btn-round google"><i class="zmdi zmdi-google-plus"></i></button>
                        </div> -->
                       
                            <button class="col-md-12 btn btn-raised btn-primary waves-effect" type="submit">Login</button>
                    </div>
                   
                </form>
                <div class="copyright text-center">
                    &copy;
                    <script>document.write(new Date().getFullYear())</script>,
                    <span><a href="">BestShifts</a></span>
                </div>
            </div>
            <div class="col-lg-8 col-sm-12">
                <div class="card">
                    <img src="/assets/images/signin.svg" alt="Sign In"/>
                </div>
            </div>
        </div>
    </div>
</div>
