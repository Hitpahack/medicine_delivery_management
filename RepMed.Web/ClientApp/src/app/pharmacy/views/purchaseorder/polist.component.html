<div class="form-grid">
    <div class="tabs">
        <button [class.active]="activeTab === 'orderwise'" (click)="onTabChange('orderwise')">Orderwise</button>
        <button [class.active]="activeTab === 'itemwise'" (click)="onTabChange('itemwise')">Itemwise</button>
        <button [class.active]="activeTab === 'distributorwise'"
            (click)="onTabChange('distributorwise')">Distributorwise</button>
    </div>
    <br />
    <!-- FILTER SECTION -->

    <div class="card-body">
        <!-- This filter for Orderwise Tab-->

        <div class="row mb-3" *ngIf="activeTab === 'orderwise'">
            <div class="col-md-4">
                <div class="position-relative">
                    <input type="text" name="poNumber" [(ngModel)]="orderwiseFilter.poNumber" class="form-control pe-5"
                        placeholder="Search PO Number..."
                        (input)="onFilterChange($event.target.value, 'orderwise_poNumber')">
                    <i class="fa fa-search position-absolute"
                        style="top: 50%; right: 15px; transform: translateY(-50%); color: #aaa;"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="input-group">
                    <input type="text" class="form-control" [(ngModel)]="orderwiseFilter.date"
                        id="dateRangePickerOrderwise" placeholder="01/05/2025-01/05/2026" readonly>
                    <span class="input-group-text">
                        <i class="bx bx-calendar"></i>
                    </span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="position-relative">
                    <input type="text" [(ngModel)]="orderwiseFilter.SupplierName" class="form-control pe-5"
                        placeholder="Search Distributor Name..." name="SupplierName"
                        (input)="onFilterChange($event.target.value, 'orderwise_SupplierName')">
                    <i class="fa fa-search position-absolute"
                        style="top: 50%; right: 15px; transform: translateY(-50%); color: #aaa;"></i>
                </div>
            </div>
        </div>

        <!-- This filter for itemwise Tab-->
        <div class="row mb-3" *ngIf="activeTab === 'itemwise'">
            <div class="col-md-4">
                <div class="position-relative">
                    <input type="text" [(ngModel)]="itemwiseFilter.itemName" class="form-control pe-5"
                        placeholder="Item Name" (input)="onFilterChange($event.target.value, 'itemwise_itemName')">
                    <i class="fa fa-search position-absolute"
                        style="top: 50%; right: 15px; transform: translateY(-50%); color: #aaa;"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="input-group">
                    <input type="text" class="form-control" [(ngModel)]="itemwiseFilter.date"
                        id="dateRangePickerItemwise" placeholder="01/05/2025-01/05/2026" readonly>
                    <span class="input-group-text">
                        <i class="bx bx-calendar"></i>
                    </span>
                </div>
            </div>
            <div class="col-md-4">
                <select [(ngModel)]="itemwiseFilter.status"
                    (change)="onFilterChange($event.target.value, 'itemwise_status')" class="form-select">
                    <option value="pending">Pending</option>
                    <option value="Orderplaced">Order Placed</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Partiallycompleted">Partially Completed</option>
                    <option value="Completed">Completed</option>
                    <option value="Expired">Expired</option>
                    <option value="Shipped">Shipped</option>
                </select>
            </div>
        </div>

        <!-- This filter for distributorwise Tab-->
        <div class="row mb-3" *ngIf="activeTab === 'distributorwise'">
            <div class="col-md-4">
                <div class="input-group">
                    <input type="text" class="form-control" [(ngModel)]="distributorwiseFilter.date"
                        id="dateRangePickerDistributorwise" placeholder="01/05/2025-01/05/2026" readonly>
                    <span class="input-group-text">
                        <i class="bx bx-calendar"></i>
                    </span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="position-relative">
                    <input type="text" (input)="onFilterChange($event.target.value, 'distributorwise_SupplierName')"
                        [(ngModel)]="distributorwiseFilter.SupplierName" name="SupplierName" class="form-control pe-5"
                        placeholder="Distributor Name">
                    <i class="fa fa-search position-absolute"
                        style="top: 50%; right: 15px; transform: translateY(-50%); color: #aaa;"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-grow-1 container-p-y">
        <div class="card">
            <div [ngSwitch]="activeTab" class="card-body">
                <app-datatable *ngSwitchCase="'orderwise'" #dataTable
                    [options]="orderwiseOptions" [(selectedItemIds)]="selectedItemIds"></app-datatable>


                <app-datatable *ngSwitchCase="'itemwise'" [options]="itemwiseOptions"
                    [(selectedItemIds)]="selectedItemIds"></app-datatable>

                <app-datatable *ngSwitchCase="'distributorwise'" [options]="distributorwiseOptions"
                    [(selectedItemIds)]="selectedItemIds"></app-datatable>

            </div>
        </div>
    </div>
</div>
