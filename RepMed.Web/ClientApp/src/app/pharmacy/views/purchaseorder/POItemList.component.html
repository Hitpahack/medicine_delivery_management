<div class="flex-grow-1 container-p-y">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <a [routerLink]="['/pharmacy/polist']" class="btn btn-sm btn-primary">Back To POList</a>
            <button class="btn btn-sm btn-primary" (click)="SendMailToDistributor(POID)">
                Place Order
            </button>
        </div>
        <div class="card-body">
            <app-datatable [options]="tableOptions"></app-datatable>
        </div>
    </div>
</div>

<!-- Qty Edit Modal -->
<div id="qtyEditModal" class="modal-overlay" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h2>Update Quantity</h2>
            <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>

        <div class="modal-body">
            <label for="qtyInput">Quantity</label>
            <input type="number" id="qtyInput" class="modal-input" min="1" />
            <p class="note">
                <i class="icon">ℹ️</i> Qty. will be reflected to item in shortbook (without any changes in item status)
            </p>
        </div>

        <div class="modal-footer">
            <button class="btn btn-primary" id="updateQtyBtn">Update</button>
        </div>
    </div>
</div>
