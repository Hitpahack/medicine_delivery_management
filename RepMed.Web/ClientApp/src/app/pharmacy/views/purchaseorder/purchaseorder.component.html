<div class="authentication">

    <form class="auth_form form_validation" *ngIf="poForm" appAutoValidate [formGroup]="poForm" (ngSubmit)="onSubmit()">
        <fieldset formGroupName="purchaseOrder">
            <legend>Add Item</legend>
            <div class="form-grid">
                <div class="position-relative">
                    <input type="text" class="form-control" placeholder="Search product" formControlName="productSearch"
                        (input)="onSearchChange(poForm.get('purchaseOrder.productSearch')?.value)" />

                    <!-- Dropdown with filtered products -->
                    <ul *ngIf="filteredProducts.length" class="dropdown-menu show" [ngClass]="{'show': showDropdown}">
                        <li class="dropdown-item header-row"
                            style="font-weight: bold; background-color: #f8f9fa; cursor: default;">
                            <span class="product-name">Item Name</span>
                            <span class="product-price">Price</span>
                        </li>
                        <li *ngFor="let product of filteredProducts" class="dropdown-item"
                            (click)="selectProduct(product)">

                            <span class="product-name">{{ product.name }}</span>
                            <span class="product-price">₹{{ product.price }}</span>

                        </li>
                    </ul>
                </div>
            </div>
        </fieldset>
    </form>

    <!-- This is my edit form -->
    <form class="auth_form form_validation" *ngIf="ItemEditForm" appAutoValidate [formGroup]="ItemEditForm"
        (ngSubmit)="onUpdate()">
        <div class="mt-3 border rounded p-2">
            <div class="d-flex align-items-center flex-wrap gap-3 fw-semibold text-muted mb-1">
                <span style="width: 80px;">Date</span>
                <span style="width: 120px;">Item</span>
                <span style="width: 150px;">Supplier</span>
                <span style="width: 80px;">Manuf.</span>
                <span style="width: 50px;">Min</span>
                <span style="width: 50px;">Stock</span>
                <span style="width: 50px;">Qty.</span>
                <span style="width: 80px;">Status</span>
                <span style="width: 80px;">Source</span>
                <span style="width: 80px;">Action</span>
            </div>
            <hr />
            <div class="d-flex align-items-center flex-wrap gap-3">
                <span style="width: 80px;">dd-MM hh:mm</span>
                <span style="width: 120px;">productname</span>
                <!-- <select class="form-select form-select-sm" style="width: 100px;" formControlName="supplierId" required>
                    <option *ngFor="let supplier of suppliers" [ngValue]="supplier.id">{{ supplier.name }}</option>
                </select> -->

                <input type="text" (keyup)="onSupplierSearch($event.target.value)" style="width: 15%; height: 4%;" placeholder="Search Supplier..." required />
                <div *ngIf="showSupplierDropdown">
                    <ul>
                        <li *ngFor="let supplier of filteredSuppliers" (click)="selectSupplier(supplier)">
                            {{ supplier.name }}
                        </li>
                    </ul>
                </div>

                <span style="width: 80px;">No</span>
                <span style="width: 50px;">No</span>
                <span style="width: 50px;">No</span>
                <input type="number" class="form-control form-control-sm" style="width: 50px;"
                    formControlName="quantity" />
                <span style="width: 80px;">Pending</span>
                <span style="width: 80px;">Shortbook</span>
                <button class="btn custom-btn" style="width: 80px;" type="submit">Update</button>
            </div>
        </div>
    </form>

    <!-- This is my ItemList Code -->
    <div class="flex-grow-1 container-p-y">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="h5 mb-0">Shortbook</span>
            </div>
            <div class="card-body">
                <app-datatable #dataTable [options]="tableOptions"></app-datatable>
            </div>
        </div>
    </div>


    <div class="row justify-content-end mt-4">
        <div class="col-sm-2">
            <button class="btn custom-btn" style="width: 130px;" type="submit">Po Generate</button>
        </div>
    </div>
</div>
