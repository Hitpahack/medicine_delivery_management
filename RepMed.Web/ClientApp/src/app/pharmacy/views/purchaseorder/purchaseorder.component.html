<div class="authentication">
    <!-- Editable Row Form -->
    <div *ngIf="selectedProduct" class="edit-form mb-3 p-2 border rounded" style="background-color: #f9f9f9;">
        <div class="row align-items-end">
            <div class="col-md-2">
                <label>Date</label>
                <input type="text" class="form-control" [value]="selectedProduct.addedDate | date:'shortDate'"
                    disabled />
            </div>
            <div class="col-md-2">
                <label>Item</label>
                <input type="text" class="form-control" [value]="selectedProduct.name" disabled />
            </div>
            <div class="col-md-2">
                <label>Supplier</label>
                <select class="form-control" [(ngModel)]="selectedProductEdit.supplierId">
                    <option *ngFor="let supplier of suppliers" [value]="supplier.id">{{ supplier.name }}</option>
                </select>
            </div>
            <div class="col-md-2">
                <label>Priority</label>
                <select class="form-control" [(ngModel)]="selectedProductEdit.priority">
                    <option value="Low">Low</option>
                    <option value="Normal">Normal</option>
                    <option value="High">High</option>
                </select>
            </div>
            <div class="col-md-1">
                <label>Qty</label>
                <input type="number" class="form-control" [(ngModel)]="selectedProductEdit.quantity" />
            </div>
            <div class="col-md-2">
                <label>Status</label>
                <select class="form-control" [(ngModel)]="selectedProductEdit.status">
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                </select>
            </div>
            <div class="col-md-2">
                <label>Shortbook</label>
            </div>
            <div class="col-md-1">
                <button class="btn btn-success w-100" (click)="updateProduct()">Update</button>
            </div>
        </div>
    </div>


    <form class="auth_form form_validation" *ngIf="poForm" appAutoValidate [formGroup]="poForm" (ngSubmit)="onSubmit()">
        <fieldset formGroupName="purchaseOrder">
            <legend>Purchase Order </legend>
            <div class="form-grid">
                <!-- Search Input -->
                <div class="position-relative">
                    <input type="text" class="form-control" placeholder="Search product" [(ngModel)]="productSearch"
                        (input)="onSearchChange($event.target.value)" />

                    <!-- Dropdown with filtered products -->
                    <ul *ngIf="filteredProducts.length" class="dropdown-menu show" [ngClass]="{'show': showDropdown}">
                        <li class="dropdown-item header-row"
                            style="font-weight: bold; background-color: #f8f9fa; cursor: default;">
                            <span class="product-name">Item Name</span>
                            <span class="product-price">Price</span>
                        </li>
                        <li *ngFor="let product of filteredProducts" class="dropdown-item"
                            (click)="selectProduct(product)">

                            <span class="product-name">{{ product.name }}</span>
                            <span class="product-price">₹{{ product.price }}</span>

                        </li>
                    </ul>
                </div>
            </div>
            <div>
                <table class="table table-bordered table-striped" *ngIf="productsList.length">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Item Name</th>
                            <th>Supplier</th>
                            <th>Priority</th>
                            <th>Qty</th>
                            <th>Status</th>
                            <th>Source</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of productsList" (click)="editProduct(item)" style="cursor: pointer;">
                            <td>{{item.addedDate}}</td>
                            <td>{{ item.name }}</td>
                            <td>{{ item.Supplier }}</td>
                            <td>{{ item.Priority }}</td>
                            <td>{{ item.quantity}}</td>
                            <td>{{ item.status }}</td>
                            <td>Shortbook</td>
                        </tr>
                    </tbody>
                </table>

                <p *ngIf="!productsList.length">No products added yet.</p>
            </div>
        </fieldset>
        <!-- Submit Button -->
        <div class="row justify-content-end mt-4">
            <div class="col-sm-2">
                <button class="btn custom-btn" style="width: 130px;" type="submit">Po Generate</button>
            </div>
        </div>
    </form>
</div>
