<div class="authentication">
    <form class="auth_form form_validation" appAutoValidate [formGroup]="PurchaseInvoice" #phForm_html="ngForm"
        (ngSubmit)="onSubmit()">
        <fieldset>
            <legend></legend>
            <div class="form-grid">
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="InvoiceNumber" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Invoice Number *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="PONumber" maxlength=""
                        minlength="">
                    <label class="float-lbl"> PO Number *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="date" class="form-control" placeholder="" formControlName="InvoiceDate" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Invoice Date *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="date" class="form-control" placeholder="" formControlName="ReceivedDate" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Received Date *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="date" class="form-control" placeholder="" formControlName="DueDate" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Due Date *</label>
                </div>
            </div>
            <div class="form-grid">
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="PaymentMode" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Payment Mode *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="PaymentStatus" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Payment Status *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="TaxAmount" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Tax Amount *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="TotalDiscount" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Total Discount *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="TotalAmount" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Total Amount *</label>
                </div>
            </div>
            <div class="form-grid">

            </div>
        </fieldset>

        <fieldset>
            <legend></legend>
            <div class="form-grid">
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="Manufacturer" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Manufacturer *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="BatchNumber" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Batch Number *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="QuantityPurchased"
                        maxlength="" minlength="">
                    <label class="float-lbl"> Quantity Purchased *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="Unit" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Unit *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="ProductPrice" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Product Price *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="PaymentStatus" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Payment Status *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="MRP" maxlength=""
                        minlength="">
                    <label class="float-lbl"> MRP *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="SellingPrice" maxlength=""
                        minlength="">
                    <label class="float-lbl"> SellingPrice *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="GSTIncluded" maxlength=""
                        minlength="">
                    <label class="float-lbl"> GST Included *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="GSTPercentage" maxlength=""
                        minlength="">
                    <label class="float-lbl"> GST Percentage *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="GSTAmount" maxlength=""
                        minlength="">
                    <label class="float-lbl"> GST Amount *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="TotalAmount" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Total Amount *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="Discount" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Discount *</label>
                </div>
                <div class="input-group mb-4 float">
                    <input type="text" class="form-control" placeholder="" formControlName="ExpiryDate" maxlength=""
                        minlength="">
                    <label class="float-lbl"> Expiry Date *</label>
                </div>
            </div>
        </fieldset>
        <div class="row justify-content-end">
            <div class="col-sm-1">
                <button class="btn custom-btn" type="submit">Save</button>
            </div>
        </div>
    </form>
</div>
